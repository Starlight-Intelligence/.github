<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Starlight Intelligence — multi-agent architecture for humans and their agents">
  <defs>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1A1206"/>
      <stop offset="26%"  stop-color="#2A1B08"/>
      <stop offset="52%"  stop-color="#120E16"/>
      <stop offset="78%"  stop-color="#141034"/>
      <stop offset="100%" stop-color="#1B1642"/>
    </linearGradient>
    <radialGradient id="warm" cx="14%" cy="46%" r="58%">
      <stop offset="0%"   stop-color="#FFC978" stop-opacity="0.42"/>
      <stop offset="42%"  stop-color="#C98A34" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1A1206" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="92%" cy="52%" r="62%">
      <stop offset="0%"   stop-color="#7B79F5" stop-opacity="0.50"/>
      <stop offset="48%"  stop-color="#3B3488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1B1642" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassFace" x1="6%" y1="0%" x2="94%" y2="100%">
      <stop offset="0%"   stop-color="#FFF8EA" stop-opacity="0.20"/>
      <stop offset="34%"  stop-color="#DCBC8E" stop-opacity="0.07"/>
      <stop offset="70%"  stop-color="#9E96FF" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFE7BC" stop-opacity="0.95"/>
      <stop offset="48%"  stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#B0A0FF" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="caustic" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFD89B" stop-opacity="0"/>
      <stop offset="46%"  stop-color="#FFEBC8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#C2B4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFDF8"/>
      <stop offset="62%"  stop-color="#FBF4E7"/>
      <stop offset="100%" stop-color="#E6DDF5"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#field)"/>
  <rect width="1280" height="640" fill="url(#warm)"/>
  <rect width="1280" height="640" fill="url(#cool)"/>

  <!-- orbital instrument, seated behind the glass -->
  <g opacity="0.55" filter="url(#bloom)" fill="none" stroke="#F6CE8C" stroke-width="1">
    <ellipse cx="930" cy="318" rx="188" ry="55" opacity="0.40"/>
    <ellipse cx="930" cy="318" rx="146" ry="42" opacity="0.52"/>
    <ellipse cx="930" cy="318" rx="104" ry="30" opacity="0.64"/>
    <ellipse cx="930" cy="318" rx="66"  ry="19" opacity="0.80"/>
    <ellipse cx="930" cy="318" rx="32"  ry="9"  opacity="0.95"/>
  </g>
  <g opacity="0.22" stroke="#C9B8FF" stroke-width="0.6" fill="none">
    <circle cx="930" cy="318" r="214"/>
    <circle cx="930" cy="318" r="256"/>
  </g>

  <!-- light shaft -->
  <path d="M300 0 L520 0 L700 640 L400 640 Z" fill="#FFDFAE" opacity="0.035" filter="url(#soft)"/>

  <!-- liquid glass pane, clear of the wordmark -->
  <g transform="translate(952 208) rotate(-7)">
    <rect x="0" y="0" width="250" height="212" rx="22" fill="url(#glassFace)"/>
    <rect x="0" y="0" width="250" height="212" rx="22" fill="none" stroke="url(#rim)" stroke-width="1.2" opacity="0.9"/>
    <rect x="12" y="12" width="226" height="188" rx="15" fill="url(#caustic)" opacity="0.75"/>
    <path d="M20 168 Q 96 140 160 164 T 238 148" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1" fill="none"/>
    <circle cx="216" cy="28" r="2.8" fill="#FFF6E0" opacity="0.9" filter="url(#bloom)"/>
  </g>

  <!-- mark + eyebrow -->
  <g transform="translate(96 118)">
    <path d="M0 0 L5 -14 L10 0 L24 5 L10 10 L5 24 L0 10 L-14 5 Z" fill="#F6CE8C" opacity="0.95"/>
  </g>
  <text x="126" y="124" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" letter-spacing="3.4" fill="#B0A594">STARLIGHT INTELLIGENCE</text>

  <!-- wordmark -->
  <text x="96" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="70" letter-spacing="-0.8" fill="url(#wordmark)">Starlight Intelligence</text>

  <!-- subtitle -->
  <text x="99" y="350" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" letter-spacing="4.2" fill="#CDC3B2" opacity="0.95">MULTI-AGENT ARCHITECTURE FOR HUMANS AND THEIR AGENTS</text>

  <line x1="99" y1="382" x2="470" y2="382" stroke="#D8AE72" stroke-opacity="0.40" stroke-width="1"/>

  <!-- meta -->
  <text x="96" y="566" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.6" fill="#918779">starlightintelligence.ai</text>
  <text x="1184" y="566" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2.6" fill="#918779">SIP v1.1.1</text>

  <rect width="1280" height="640" filter="url(#grain)" opacity="0.5"/>
</svg>
