name: pr-gate

# Reusable merge gate. Callers install pr-gate/caller.yml and pin this file to a commit SHA.
# It reads the PR through the API and never checks out or runs the PR's code, which is what makes
# running it from pull_request_target safe.
on:
  workflow_call:
    inputs:
      pr-number:
        description: PR to judge, as a string. Anything that is not a plain number is a no-op.
        required: true
        type: string
      merge:
        description: Reserved for compatibility. True is refused; this gate is report-only.
        required: false
        type: boolean
        default: false
      gate-ref:
        description: Commit of Starlight-Intelligence/.github to load the gate from. Pin it to the same SHA as the uses line.
        required: false
        type: string
        default: ''
      required-checks:
        description: Comma-separated check run names that must pass on the head commit, e.g. "test, build".
        required: true
        type: string
      wait-minutes:
        description: Deprecated compatibility input. Reports are immediate and never poll.
        required: false
        type: number
        default: 8

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    steps:
      - name: Require an immutable gate source
        env:
          GATE_REF: ${{ inputs.gate-ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          node <<'NODE'
          // source-ref-validator:start
          const e = process.env;
          if (!/^[a-f0-9]{40}$/.test(e.GATE_REF || '') || e.GATE_REF !== e.JOB_WORKFLOW_SHA || e.JOB_WORKFLOW_REPOSITORY !== 'Starlight-Intelligence/.github') process.exit(1);
          // source-ref-validator:end
          NODE
      - name: Load the gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Starlight-Intelligence/.github
          ref: ${{ inputs.gate-ref }}
          path: .pr-gate
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          PR_GATE_MERGE: ${{ inputs.merge }}
          PR_GATE_WAIT_MINUTES: ${{ inputs.wait-minutes }}
          PR_GATE_REQUIRED_CHECKS: ${{ inputs.required-checks }}
        run: node .pr-gate/pr-gate/run.mjs
