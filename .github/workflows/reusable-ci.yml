name: Reusable Estate CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      run-build:
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Draft-Gated)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Secret pattern gate
        run: |
          if git grep -I -E "(sk-ant-api|sk-proj-|ghp_[A-Za-z0-9]{30,}|AIzaSy[A-Za-z0-9_-]{33})" -- . ':!*.lock' ':!package-lock.json'; then
            echo "Potential secret pattern detected!"
            exit 1
          fi

      - name: Install and test
        run: |
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              corepack enable && pnpm install --frozen-lockfile
              pnpm test --if-present
            elif [ -f package-lock.json ]; then
              npm ci
              npm test --if-present
            fi
          fi
