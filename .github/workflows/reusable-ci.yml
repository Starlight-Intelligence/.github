name: Reusable Estate CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      runner:
        description: 'Runner label or "auto" (uses blacksmith-4vcpu-ubuntu-2404 when vars.CI_RUNNER==blacksmith, ubuntu-slim for non-build jobs, else ubuntu-latest).'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        required: false
        type: number
        default: 10
      run-build:
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Draft-Gated)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner != 'auto' && inputs.runner || (vars.CI_RUNNER == 'blacksmith' && github.event.repository.fork == false && (github.event_name == 'push' || github.event.pull_request.head.repo.id == github.event.repository.id) && 'blacksmith-4vcpu-ubuntu-2404') || (!inputs.run-build && 'ubuntu-slim') || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm when lockfile present
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Cache pnpm store
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache npm store
        if: hashFiles('package-lock.json') != '' && hashFiles('pnpm-lock.yaml') == ''
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Secret pattern gate
        run: |
          if git grep -I -E "(sk-ant-api|sk-proj-|ghp_[A-Za-z0-9]{30,}|AIzaSy[A-Za-z0-9_-]{33})" -- . ':!*.lock' ':!package-lock.json'; then
            echo "Potential secret pattern detected!"
            exit 1
          fi

      - name: Install, test, and optional build
        run: |
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
              pnpm run --if-present test
              if [ "${{ inputs.run-build }}" = "true" ]; then
                pnpm run --if-present build
              fi
            elif [ -f package-lock.json ]; then
              npm ci
              npm run --if-present test
              if [ "${{ inputs.run-build }}" = "true" ]; then
                npm run --if-present build
              fi
            fi
          fi
