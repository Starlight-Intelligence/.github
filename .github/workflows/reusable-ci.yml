name: Reusable Estate CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      runner:
        description: 'Use ubuntu-slim for short jobs verified on a single CPU. Existing callers keep the standard runner.'
        required: false
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        required: false
        type: number
        default: 10
      run-build:
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Draft-Gated)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Secret pattern gate
        run: |
          if git grep -I -E "(sk-ant-api|sk-proj-|ghp_[A-Za-z0-9]{30,}|AIzaSy[A-Za-z0-9_-]{33})" -- . ':!*.lock' ':!package-lock.json'; then
            echo "Potential secret pattern detected!"
            exit 1
          fi

      - name: Install, test, and optional build
        run: |
          if [ -f package.json ]; then
            if [ -f pnpm-lock.yaml ]; then
              corepack enable && pnpm install --frozen-lockfile
              pnpm run --if-present test
              if [ "${{ inputs.run-build }}" = "true" ]; then
                pnpm run --if-present build
              fi
            elif [ -f package-lock.json ]; then
              npm ci
              npm run --if-present test
              if [ "${{ inputs.run-build }}" = "true" ]; then
                npm run --if-present build
              fi
            fi
          fi
