# Copy to .github/workflows/pr-gate.yml in a product repo, with poke.yml beside it.
# Replace GATE_SHA (both places) with a commit of Starlight-Intelligence/.github, list the repo's CI
# workflow names under workflow_run and its check names in required-checks, and set merge to true
# only where autonomous landing is ruled.
#
# Every trigger here runs this file from the default branch, never from the PR, so a PR cannot
# rewrite the gate it is judged by. Reviews arrive through pr-gate-poke (no permissions) and come
# back here as workflow_run.
name: pr-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [pr-gate-poke, CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  pr-gate:
    # Comments re-run the gate only for a result from an allowlisted reviewer bot, or a /gate from
    # the repo owner. A comment can only trigger a re-read; it never counts as a sign-off.
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'workflow_run') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
        contains(fromJSON('["chatgpt-codex-connector[bot]","claude[bot]"]'), github.event.comment.user.login) ||
        (startsWith(github.event.comment.body, '/gate') && github.event.comment.author_association == 'OWNER')))
    uses: Starlight-Intelligence/.github/.github/workflows/pr-gate.yml@GATE_SHA
    with:
      pr-number: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || '' }}
      head-sha: ${{ github.event.workflow_run.head_sha || '' }}
      required-checks: test
      merge: false
      gate-ref: GATE_SHA
