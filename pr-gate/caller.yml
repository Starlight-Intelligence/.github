# Copy to .github/workflows/pr-gate.yml in a product repo, with poke.yml beside it.
# Replace GATE_SHA (both places) with a commit of Starlight-Intelligence/.github, list the repo's CI
# workflow names under workflow_run and authenticated contexts in required-checks.
# This gate remains report-only; merge=true is refused.
#
# Every trigger here runs this file from the default branch, never from the PR, so a PR cannot
# rewrite the gate it is judged by. Reviews arrive through pr-gate-poke (no permissions) and come
# back here as workflow_run.
name: pr-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [pr-gate-poke, CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  actions: read

jobs:
  pr-gate:
    # Comments re-run the gate only for a result from an allowlisted reviewer bot, or an exact
    # `/gate` from an owner or org member. A comment can only trigger a re-read, never a sign-off.
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'workflow_run') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
        contains(fromJSON('["chatgpt-codex-connector[bot]","claude[bot]"]'), github.event.comment.user.login) ||
        (github.event.comment.body == '/gate' && contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association))))
    uses: Starlight-Intelligence/.github/.github/workflows/pr-gate.yml@GATE_SHA
    with:
      # workflow_run resolves its PR from API-authenticated run/repository/head data.
      pr-number: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || 0) }}
      required-checks: >-
        [{"name":"test","appId":15368,"workflowPath":".github/workflows/ci.yml"}]
      merge: false
      gate-ref: GATE_SHA
